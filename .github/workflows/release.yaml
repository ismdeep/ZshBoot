name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          GIT_TAG="${GITHUB_REF_NAME:?}" make build

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          safe_tag="${GITHUB_REF_NAME//\//-}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "build/ZshBoot-${safe_tag}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "build/ZshBoot-${safe_tag}.zip" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
